name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Build APK
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist/apk
          for flavor in standard legacy; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            if [ -f "$apk" ]; then
              cp -v "$apk" dist/apk/
            fi
          done
          ls -la dist/apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: wepower-apk
          path: dist/apk/*.apk
